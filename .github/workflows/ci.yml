name: CI

# Runs on pull requests and on pushes to the branches that matter. Railway
# deploys from dev-soundmap/main, so a red run here is the warning before a
# bad deploy rather than after it.
on:
  pull_request:
  push:
    branches: [main, dev-soundmap]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest==8.3.4 ruff==0.8.6

      - name: Lint
        run: ruff check backend tests

      - name: Test
        # No secrets: every test is offline and uses fake configuration.
        run: pytest

  docker-build:
    name: Docker image builds and answers /healthz
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: soundmap:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and check the health endpoint
        run: |
          docker run -d --name soundmap -p 8000:8000 \
            -e SESSION_SECRET=ci-only-secret \
            -e CANONICAL_HOST= \
            soundmap:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "never became healthy; container logs follow:"
          docker logs soundmap
          exit 1

      - name: Confirm the image does not run as root
        run: test "$(docker run --rm soundmap:ci id -u)" != "0"
