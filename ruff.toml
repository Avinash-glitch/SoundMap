# Deliberately conservative: this is a working app, not a greenfield one.
# The rules here catch real mistakes (undefined names, unused imports, bare
# excepts) without demanding a sweeping reformat.
line-length = 120
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F", "B", "UP032", "C4"]
ignore = [
    "E722",  # bare except: used deliberately around optional integrations
    "B008",  # FastAPI Depends() in defaults is the documented pattern
    "B904",  # raise ... from err: worth doing, but a separate cleanup
]

[lint.per-file-ignores]
"tests/*" = ["E501"]
